<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Axora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/movil.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-solida" id="navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../../../index.html">
                <img src="../assets/img/logo.png" alt="Logo Axora" class="logo-img"> 
                <span class="brand-text">AXORA</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                aria-label="Abrir menú">
                <span class="toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="../../../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== CONTACTO ===== -->
    <main class="seccion seccion-contacto">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <h1 class="titulo-seccion text-center">Hablemos de tu <span class="acento">proyecto</span></h1>
                    <p class="sub-seccion text-center mx-auto">
                        Completá el formulario y te respondo en menos de 24 horas.
                    </p>

                    <form class="form-axora mt-4" id="formContacto" action="#" method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com" required>
                            </div>
                            <div class="col-12">
                                <label for="negocio" class="form-label">Tu negocio</label>
                                <input type="text" class="form-control" id="negocio" name="negocio" placeholder="Ej: Cafetería, tienda de ropa...">
                            </div>
                            <div class="col-12">
                                <label for="mensaje" class="form-label">Contame tu idea *</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"
                                    placeholder="Quiero una página web para..." required></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-axora btn-lg px-5">Enviar mensaje</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer text-center">
        <div class="container">
            <p class="brand-text footer-brand">AXORA</p>
            <small>© 2026 Axora — Hecho con 💜 por Santiago</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/main.js"></script>

    <!-- ===== BOTÓN WHATSAPP FLOTANTE ===== -->
    <a href="https://wa.me/59892491098" class="btn-whatsapp" target="_blank" rel="noopener"
        aria-label="Chatear por WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
    </a>
    <script>
        const form = document.getElementById("formContacto");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const datos = new FormData(form);
            const nombre = datos.get("nombre").trim();
            const email = datos.get("email").trim();
            const negocio = datos.get("negocio").trim();
            const mensaje = datos.get("mensaje").trim();

            const cuerpo = [
                "=========================================",
                "   NUEVO MENSAJE DE CONTACTO - AXORA",
                "=========================================",
                "",
                "NOMBRE",
                nombre,
                "",
                "EMAIL",
                email,
                "",
                "NEGOCIO",
                negocio || "(no especificado)",
                "",
                "MENSAJE",
                mensaje,
                "",
                "-----------------------------------------",
                "Enviado desde axora.pages.dev"
            ].join("\n");

            const asunto = "Nuevo mensaje de contacto | Axora";

            window.location.href =
                "mailto:AxoraProject@proton.me?subject=" +
                encodeURIComponent(asunto) +
                "&body=" +
                encodeURIComponent(cuerpo);
        });
    </script>
</body>
</html>
