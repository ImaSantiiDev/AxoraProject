<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Axora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/movil.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-solida" id="navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../../../index.html">
                <img src="../assets/img/logo.png" alt="Logo Axora" class="logo-img"> 
                <span class="brand-text">AXORA</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav"
                aria-label="Abrir menú">
                <span class="toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="../../../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== CONTACTO ===== -->
    <main class="seccion seccion-contacto">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <h1 class="titulo-seccion text-center">Hablemos de tu <span class="acento">proyecto</span></h1>
                    <p class="sub-seccion text-center mx-auto">
                        Completá el formulario y te respondemos en menos de 24 horas.
                    </p>

                    <form class="form-axora mt-4" action="mailto:AxoraProject@proton.me" method="post" enctype="text/plain">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com" required>
                            </div>
                            <div class="col-12">
                                <label for="negocio" class="form-label">Tu negocio</label>
                                <input type="text" class="form-control" id="negocio" name="negocio" placeholder="Ej: Cafetería, tienda de ropa...">
                            </div>
                            <div class="col-12">
                                <label for="mensaje" class="form-label">Contanos tu idea *</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"
                                    placeholder="Quiero una página web para..." required></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-axora btn-lg px-5">Enviar mensaje</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer text-center">
        <div class="container">
            <p class="brand-text footer-brand">AXORA</p>
            <small>© 2026 Axora — Hecho con 💜 por Santi & Franco</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/main.js"></script>
</body>
</html>
